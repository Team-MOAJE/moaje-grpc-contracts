syntax = "proto3";
package moaje.events.banking;

option java_package = "com.moaje.events.banking";
option java_multiple_files = true;

message AccountCreatedEvent {
  string event_id = 1;
  string user_id = 2;
  string account_number = 3;
  string bank_code = 4;
  string product_name = 5;
  int64 initial_balance = 6;
  string created_at = 7;
  string canceled_at = 8;
  string occurred_at = 9;
}

message BankingTransferCompletedEvent {
  string event_id = 1;
  int64 transfer_id = 2;
  int64 asset_transaction_id = 3;
  string external_transaction_id = 4;
  string response_code = 5;
  string occurred_at = 6;
}

message BankingTransferFailedEvent {
  string event_id = 1;
  int64 transfer_id = 2;
  int64 asset_transaction_id = 3;
  string response_code = 4;
  string reason = 5;
  string occurred_at = 6;
}
