syntax = "proto3";
package moaje.grpc.asset;

import "common/resources.proto";

option java_package = "com.moaje.grpc.asset";
option java_multiple_files = true;

service AssetService {
  rpc ReserveTransfer(ReserveTransferRequest) returns (ReserveTransferResponse);
  rpc CompleteTransfer(CompleteTransferRequest) returns (TransferStateResponse);
  rpc FailTransfer(FailTransferRequest) returns (TransferStateResponse);
  rpc ApplyExternalTransaction(ApplyExternalTransactionRequest) returns (TransferStateResponse);
  rpc GetDailyCashflow(GetDailyCashflowRequest) returns (GetDailyCashflowResponse);
}

message ReserveTransferRequest {
  int64 user_id = 1;
  int64 account_id = 2;
  string target_token = 3;
  moaje.common.Money amount = 4;
  moaje.common.Idempotency idempotency = 5;
  string ci = 6;
  string user_name = 7;
  string phone_number = 8;
  string withdrawal_account_id = 9;
  string deposit_bank_code = 10;
  string deposit_account_number = 11;
}

message ReserveTransferResponse {
  int64 transfer_id = 1;
  string public_transfer_id = 2;
  int64 asset_transaction_id = 3;
}

message CompleteTransferRequest {
  int64 transfer_id = 1;
  string external_transaction_id = 2;
}

message FailTransferRequest {
  int64 transfer_id = 1;
  string reason = 2;
}

message ApplyExternalTransactionRequest {
  int64 user_id = 1;
  int64 account_id = 2;
  string account_token = 3;
  string external_transaction_id = 4;
  string type = 5;
  moaje.common.Money amount = 6;
  string target_token = 7;
  string occurred_at = 8;
}

message TransferStateResponse {
  bool success = 1;
  string message = 2;
}

message GetDailyCashflowRequest {
  int64 user_id = 1;
  moaje.common.Money expected_income = 2;
  moaje.common.Money fixed_expenses = 3;
  moaje.common.Money event_buffer = 4;
  int32 days_until_next_payday = 5;
  string snapshot_date = 6;
  bool force_refresh = 7;
}

message GetDailyCashflowResponse {
  int64 user_id = 1;
  moaje.common.Money current_balance = 2;
  moaje.common.Money expected_income = 3;
  moaje.common.Money fixed_expenses = 4;
  moaje.common.Money event_buffer = 5;
  int32 days_until_next_payday = 6;
  moaje.common.Money daily_limit = 7;
  string snapshot_date = 8;
}
