syntax = "proto3";
package moaje.grpc.banking;

import "common/resources.proto";

option java_package = "com.moaje.grpc.banking";
option java_multiple_files = true;

service BankingService {
  rpc GetTransferProjectionStates(GetTransferProjectionStatesRequest) returns (GetTransferProjectionStatesResponse);
  rpc GetAccountProjectionSnapshot(GetAccountProjectionSnapshotRequest) returns (GetAccountProjectionSnapshotResponse);
}

message GetTransferProjectionStatesRequest {
  int64 account_id = 1;
  repeated int64 transfer_ids = 2;
}

message GetTransferProjectionStatesResponse {
  repeated TransferProjectionState transfers = 1;
}

message TransferProjectionState {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    REQUESTED = 1;
    PROCESSING = 2;
    SUCCEEDED = 3;
    FAILED = 4;
    UNKNOWN = 5;
    REVERSED = 6;
  }

  int64 transfer_id = 1;
  string principal_id = 2;
  int64 account_id = 3;
  moaje.common.Money amount = 4;
  Status status = 5;
  string external_transaction_id = 6;
  string external_reversal_transaction_id = 7;
  string failure_code = 8;
  string failure_reason = 9;
  string reversal_reason = 10;
}

message GetAccountProjectionSnapshotRequest {
  int64 account_id = 1;
  int64 cursor_epoch_millis = 2;
}

message GetAccountProjectionSnapshotResponse {
  int64 account_id = 1;
  string principal_id = 2;
  moaje.common.Money balance = 3;
  string account_status = 4;
  int64 as_of_epoch_millis = 5;
  repeated ExternalProjectionTransaction transactions = 6;
}

message ExternalProjectionTransaction {
  string external_transaction_id = 1;
  string type = 2;
  moaje.common.Money amount = 3;
  int64 occurred_at_epoch_millis = 4;
  optional int64 completed_at_epoch_millis = 5;
}
