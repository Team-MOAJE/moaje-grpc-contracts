syntax = "proto3";
package moaje.grpc.banking;

import "common/resources.proto";

option java_package = "com.moaje.grpc.banking";
option java_multiple_files = true;

service BankingService {
  rpc ExecuteTransfer(ExecuteTransferRequest) returns (ExecuteTransferResponse);
  rpc SyncExternalAccountTransactions(SyncExternalAccountTransactionsRequest) returns (SyncExternalAccountTransactionsResponse);
}

message ExecuteTransferRequest {
  int64 transfer_id = 1;
  int64 asset_transaction_id = 2;
  string ci = 3;
  string user_name = 4;
  string phone_number = 5;
  string withdrawal_account_id = 6;
  string deposit_bank_code = 7;
  string deposit_account_number = 8;
  moaje.common.Money amount = 9;
}

message ExecuteTransferResponse {
  enum Status {
    SUCCESS = 0;
    FAILED = 1;
    TIMEOUT = 2;
  }

  Status status = 1;
  string external_transaction_id = 2;
  string response_code = 3;
  string failure_reason = 4;
}

message SyncExternalAccountTransactionsRequest {
  int64 user_id = 1;
  int64 asset_account_id = 2;
  string account_token = 3;
  string external_account_number = 4;
  string ci = 5;
  string user_name = 6;
  string phone_number = 7;
  string cursor = 8;
}

message SyncExternalAccountTransactionsResponse {
  bool success = 1;
  int32 synced_count = 2;
  string message = 3;
}
